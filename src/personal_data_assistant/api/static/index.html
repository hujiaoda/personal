<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>个人数据助手</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #273449;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #34d399;
      --danger: #f87171;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(160deg, #0f172a 0%, #111827 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    .shell { max-width: 860px; margin: 0 auto; padding: 20px 16px 32px; }
    header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    header h1 { font-size: 24px; margin: 0; }
    #health { color: var(--muted); font-size: 12px; }
    .modes { display: flex; gap: 8px; margin-bottom: 14px; }
    .mode-btn {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      font-size: 14px;
    }
    .mode-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(56, 189, 248, 0.08);
    }
    #chat {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      min-height: 320px;
      max-height: 58vh;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .empty-tip { color: var(--muted); text-align: center; margin-top: 48px; font-size: 14px; }
    .msg { max-width: 82%; }
    .msg.user { align-self: flex-end; }
    .msg.assistant { align-self: flex-start; }
    .msg .bubble {
      padding: 10px 12px;
      border-radius: 12px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 15px;
    }
    .msg.user .bubble { background: #155e75; }
    .msg.assistant .bubble { background: var(--panel-2); }
    .msg.error .bubble { background: #7f1d1d; color: #fecaca; }
    .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
    details.tool {
      align-self: flex-start;
      max-width: 82%;
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      background: #172033;
    }
    details.tool summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 12px;
      user-select: none;
    }
    details.tool code {
      display: block;
      margin-top: 8px;
      font-size: 12px;
      color: #7dd3fc;
      white-space: pre-wrap;
      word-break: break-all;
    }
    table.result { border-collapse: collapse; margin-top: 8px; font-size: 12px; width: 100%; }
    table.result th, table.result td { border: 1px solid var(--border); padding: 4px 6px; text-align: left; }
    table.result th { background: var(--panel-2); }
    form { display: flex; gap: 8px; margin-top: 12px; }
    #question {
      flex: 1;
      resize: vertical;
      min-height: 44px;
      max-height: 160px;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 15px;
      line-height: 1.4;
      outline: none;
    }
    #question:focus { border-color: var(--accent); }
    #send {
      width: 88px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #082f49;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    #send:disabled { opacity: 0.45; cursor: not-allowed; }
    footer { color: var(--muted); font-size: 12px; margin-top: 14px; text-align: center; }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <h1>个人数据助手</h1>
      <span id="health">正在检查服务状态…</span>
    </header>

    <div class="modes">
      <button type="button" class="mode-btn active" data-endpoint="/ask">🧠 记忆问答</button>
      <button type="button" class="mode-btn" data-endpoint="/ask_sql">📊 问数</button>
    </div>

    <main id="chat" aria-live="polite">
      <div class="empty-tip">问我“上周学了什么”，或者“八月餐饮花了多少钱”。</div>
    </main>

    <form id="chat-form">
      <textarea id="question" rows="1" placeholder="输入问题，回车发送，Shift+回车换行"></textarea>
      <button id="send" type="submit">发送</button>
    </form>

    <footer>FastAPI + SSE 流式输出 · 模型调用超时/重试/降级由后端兜底</footer>
  </div>

  <script>
    (() => {
      "use strict";

      const chat = document.getElementById("chat");
      const form = document.getElementById("chat-form");
      const input = document.getElementById("question");
      const sendBtn = document.getElementById("send");
      const healthEl = document.getElementById("health");
      const modeButtons = Array.from(document.querySelectorAll(".mode-btn"));

      let mode = "/ask";
      let streaming = false;

      function setMode(next) {
        mode = next;
        modeButtons.forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.endpoint === mode);
        });
        input.placeholder = mode === "/ask"
          ? "问记忆：上周学了什么？"
          : "问数据：八月餐饮花了多少钱？";
      }

      modeButtons.forEach((btn) => {
        btn.addEventListener("click", () => setMode(btn.dataset.endpoint));
      });

      function clearEmptyTip() {
        const tip = chat.querySelector(".empty-tip");
        if (tip) tip.remove();
      }

      function addUserMessage(text) {
        clearEmptyTip();
        const msg = document.createElement("div");
        msg.className = "msg user";
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;
        msg.appendChild(bubble);
        chat.appendChild(msg);
        chat.scrollTop = chat.scrollHeight;
      }

      function addAssistantMessage() {
        clearEmptyTip();
        const msg = document.createElement("div");
        msg.className = "msg assistant";
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = "";
        msg.appendChild(bubble);
        chat.appendChild(msg);
        chat.scrollTop = chat.scrollHeight;
        return bubble;
      }

      function appendDelta(bubble, delta) {
        if (!delta) return;
        bubble.textContent += delta;
        chat.scrollTop = chat.scrollHeight;
      }

      function setMessageError(bubble, message) {
        if (bubble) {
          bubble.closest(".msg").className = "msg assistant error";
          bubble.textContent = message;
        } else {
          const errorBubble = addAssistantMessage();
          errorBubble.closest(".msg").className = "msg assistant error";
          errorBubble.textContent = message;
        }
        chat.scrollTop = chat.scrollHeight;
      }

      function addToolDetails(title) {
        const details = document.createElement("details");
        details.className = "tool";
        const summary = document.createElement("summary");
        summary.textContent = title;
        const code = document.createElement("code");
        details.appendChild(summary);
        details.appendChild(code);
        chat.appendChild(details);
        chat.scrollTop = chat.scrollHeight;
        return { details, code };
      }

      function appendToolDelta(tool, delta) {
        if (!tool) {
          tool = addToolDetails("🔧 工具调用");
        }
        tool.code.textContent += delta;
        chat.scrollTop = chat.scrollHeight;
        return tool;
      }

      function renderSqlResult(done) {
        const details = document.createElement("details");
        details.className = "tool";
        details.open = false;
        const summary = document.createElement("summary");
        summary.textContent = `📊 SQL 与查询结果（${done.row_count ?? 0} 行）`;
        details.appendChild(summary);

        const sqlBlock = document.createElement("code");
        sqlBlock.textContent = done.sql || "";
        details.appendChild(sqlBlock);

        if (Array.isArray(done.columns) && Array.isArray(done.rows)) {
          const table = document.createElement("table");
          table.className = "result";
          const thead = document.createElement("thead");
          const headRow = document.createElement("tr");
          done.columns.forEach((column) => {
            const th = document.createElement("th");
            th.textContent = String(column);
            headRow.appendChild(th);
          });
          thead.appendChild(headRow);
          table.appendChild(thead);

          const tbody = document.createElement("tbody");
          done.rows.forEach((row) => {
            const tr = document.createElement("tr");
            (Array.isArray(row) ? row : []).forEach((cell) => {
              const td = document.createElement("td");
              td.textContent = cell === null ? "NULL" : String(cell);
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
          });
          table.appendChild(tbody);
          details.appendChild(table);
        }
        if (done.truncated) {
          const note = document.createElement("div");
          note.className = "meta";
          note.textContent = "结果被行数上限截断，以上只是前若干行。";
          details.appendChild(note);
        }
        chat.appendChild(details);
        chat.scrollTop = chat.scrollHeight;
      }

      function handleEvent(event, ui) {
        if (event.type === "status") {
          appendDelta(ui.bubble, "");
          return;
        }
        if (event.type === "chunk") {
          appendDelta(ui.bubble, event.delta);
          return;
        }
        if (event.type === "tool") {
          ui.tool = appendToolDelta(ui.tool, event.delta);
          return;
        }
        if (event.type === "done") {
          if (!ui.bubble.textContent && event.answer) {
            appendDelta(ui.bubble, event.answer);
          }
          if (event.status === "forced_final") {
            appendDelta(ui.bubble, "\n\n（系统按兜底策略完成了回答）");
          }
          if (mode === "/ask_sql") renderSqlResult(event);
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = `状态：${event.status}${event.usage ? ` · tokens：${event.usage.total_tokens}` : ""}`;
          ui.bubble.closest(".msg").appendChild(meta);
          return;
        }
        if (event.type === "error") {
          setMessageError(ui.bubble, event.message || "请求失败");
        }
      }

      async function consumeSSE(response, ui) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          let separator;
          while ((separator = buffer.indexOf("\n\n")) >= 0) {
            const rawEvent = buffer.slice(0, separator);
            buffer = buffer.slice(separator + 2);
            const dataLines = rawEvent
              .split("\n")
              .filter((line) => line.startsWith("data:"))
              .map((line) => line.slice(5).trim());
            if (!dataLines.length) continue;
            try {
              handleEvent(JSON.parse(dataLines.join("\n")), ui);
            } catch (err) {
              setMessageError(ui.bubble, "流式响应解析失败：" + err);
            }
          }
        }
      }

      async function sendQuestion() {
        const question = input.value.trim();
        if (!question || streaming) return;
        streaming = true;
        sendBtn.disabled = true;
        addUserMessage(question);
        input.value = "";
        const bubble = addAssistantMessage();
        const ui = { bubble, tool: null };
        const endpoint = mode;
        try {
          const response = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question, stream: true, timeout: 120 })
          });
          if (!response.ok) {
            let message = "HTTP " + response.status;
            try {
              const body = await response.json();
              message = body.error && body.error.message ? body.error.message : message;
            } catch (err) {
              // 保留 HTTP 状态兜底
            }
            setMessageError(bubble, message);
            return;
          }
          await consumeSSE(response, ui);
        } catch (err) {
          setMessageError(bubble, "请求失败：" + err);
        } finally {
          streaming = false;
          sendBtn.disabled = false;
          input.focus();
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        sendQuestion();
      });

      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          sendQuestion();
        }
      });

      fetch("/health")
        .then((response) => response.json())
        .then((body) => {
          const parts = [];
          if (body.components) {
            Object.entries(body.components).forEach(([name, info]) => {
              if (info && info.status) parts.push(`${name}:${info.status}`);
            });
          }
          healthEl.textContent = "服务状态：" + (parts.length ? parts.join(" · ") : body.status);
        })
        .catch(() => {
          healthEl.textContent = "服务状态：不可用";
        });
    })();
  </script>
</body>
</html>
