[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-data-assistant"
version = "0.1.0"
description = "个人数据助手：个人记忆检索 + SQLite 智能问数 + 用户习惯记忆（DeepSeek + 手写核心机制）"
requires-python = ">=3.10,<3.13"
dependencies = [
    "httpx>=0.27,<1",      # M1 手写 DeepSeek 客户端
    "fastapi>=0.115,<0.116",  # M4 Web 接口；锁 0.115.x 避免新版 TestClient 弃用告警
    "uvicorn>=0.30,<1",    # M4 本地运行 FastAPI
]  # M2/M3 只用标准库 sqlite3 无新依赖

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "-m", "not integration"]
markers = [
    "integration: 需要真实 DeepSeek API 密钥的测试，默认不跑（后续里程碑使用）",
]
